name: Redirect to unified transport academy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Create compatibility redirect
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://mars-tw.github.io/taiwan-island-drive/flight/"><title>島嶼交通學院</title></head><body><p>這個版本已合併到島嶼交通學院。</p><a href="https://mars-tw.github.io/taiwan-island-drive/flight/">開啟合併版</a><script>location.replace('https://mars-tw.github.io/taiwan-island-drive/flight/'+location.search+location.hash)</script></body></html>
          HTML
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
      - name: Publish redirect
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
